<!doctype html>
<html lang="ru">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta charset="utf-8">
<title>Электролаб 8</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1f4fbf">
<link rel="icon" href="icons/lab-192.png">
<link rel="apple-touch-icon" href="icons/lab-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Электролаб 8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=PT+Sans:wght@400;700&family=Rubik:wght@500;600&display=swap">
<style>
/* Layout: physics cabinet — wooden shelf | assembly bench (dot-grid board) | live circuit diagram; lab notebook on squared paper below */
:root{
  --bg:#e5e9ee;--panel:#fbfcfd;--ink:#1b2531;--muted:#566474;--line:#cfd7e0;
  --accent:#1f4fb5;--accent-ink:#ffffff;--accent-soft:#e2eafb;
  --ok:#1b7a44;--ok-soft:#e0f2e7;--bad:#b3352a;--bad-soft:#fae5e2;--warn:#8a5a0c;--warn-soft:#faefd9;
  --wood:#a5774a;--wood-dark:#7a5532;--wood-light:#c49668;--shelf-ink:#fff6e8;
  --board:#edf0f3;--board-dot:#c1c9d3;--board-edge:#d3dae2;
  --case:#f4f6f8;--case-edge:#8592a2;--case-2:#d9e0e8;
  --dial:#fbfaf2;--dial-ink:#262a31;--needle:#c62f28;--glass:#e8f0f6;--coil:#8a6a3a;
  --paper:#fcfdff;--paper-grid:#dbe5f2;--paper-margin:#e3a1a1;
  --w1:#cd3a34;--w2:#2c5bcc;--w3:#2a2f37;--w4:#d6981b;--w5:#28905a;--wire-edge:rgba(10,14,20,.38);
  --term-red:#c62f28;--term-black:#2a2f37;--term-metal:#b4bcc6;--glow:#ffd457;--flow:#fffbe6;
  --font-display:"Rubik","PT Sans","Segoe UI",system-ui,sans-serif;
  --font-body:"PT Sans","Segoe UI",system-ui,sans-serif;
  --font-mono:"IBM Plex Mono",Consolas,ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#10151b;--panel:#182029;--ink:#e1e7ee;--muted:#93a0af;--line:#2b3542;
  --accent:#86a7ff;--accent-ink:#0b1426;--accent-soft:#1d2a46;
  --ok:#55c387;--ok-soft:#14301f;--bad:#ff8071;--bad-soft:#391c19;--warn:#f0b351;--warn-soft:#382a12;
  --wood:#6b4d31;--wood-dark:#4a3420;--wood-light:#86653f;--shelf-ink:#fff1dc;
  --board:#1b222b;--board-dot:#334050;--board-edge:#252e39;
  --case:#29313c;--case-edge:#6d7b8c;--case-2:#384250;
  --dial:#ebe8db;--dial-ink:#262a31;--needle:#d63a33;--glass:#cfdbe5;--coil:#b08d5c;
  --paper:#161c24;--paper-grid:#242e3b;--paper-margin:#6a3a3a;
  --w1:#e2524c;--w2:#5b84ea;--w3:#a2abb9;--w4:#e6ab33;--w5:#3db06f;--wire-edge:rgba(0,0,0,.6);
  --term-red:#e2473f;--term-black:#0f1317;--term-metal:#8d97a3;--glow:#ffd457;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#10151b;--panel:#182029;--ink:#e1e7ee;--muted:#93a0af;--line:#2b3542;
  --accent:#86a7ff;--accent-ink:#0b1426;--accent-soft:#1d2a46;
  --ok:#55c387;--ok-soft:#14301f;--bad:#ff8071;--bad-soft:#391c19;--warn:#f0b351;--warn-soft:#382a12;
  --wood:#6b4d31;--wood-dark:#4a3420;--wood-light:#86653f;--shelf-ink:#fff1dc;
  --board:#1b222b;--board-dot:#334050;--board-edge:#252e39;
  --case:#29313c;--case-edge:#6d7b8c;--case-2:#384250;
  --dial:#ebe8db;--dial-ink:#262a31;--needle:#d63a33;--glass:#cfdbe5;--coil:#b08d5c;
  --paper:#161c24;--paper-grid:#242e3b;--paper-margin:#6a3a3a;
  --w1:#e2524c;--w2:#5b84ea;--w3:#a2abb9;--w4:#e6ab33;--w5:#3db06f;--wire-edge:rgba(0,0,0,.6);
  --term-red:#e2473f;--term-black:#0f1317;--term-metal:#8d97a3;--glow:#ffd457;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--font-body);padding-inline:16px;padding-block:14px 28px}
table{font-size:inherit}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.app{max-width:1680px;margin-inline:auto;display:grid;gap:14px}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 22px}
.brand{display:flex;align-items:center;gap:14px;margin-right:auto;min-width:0}
.emblem{width:72px;height:72px;flex:none;display:block;border-radius:50%;object-fit:cover}
.brand h1{margin:0;font:600 1.55rem/1.1 var(--font-display);letter-spacing:.01em}
.brand p{margin:2px 0 0;color:var(--muted);font-size:.95rem}
.brand .author{color:var(--ink);font-size:.9rem}
.tabs{display:flex;flex-wrap:wrap;gap:6px}
.tab{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:6px 13px;font-size:.9rem;white-space:nowrap}
.tab:hover{border-color:var(--accent)}
.tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--panel)}
.lang button{border:0;background:transparent;padding:6px 13px;font-size:.9rem}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

.work{display:grid;grid-template-columns:176px minmax(0,1.55fr) minmax(0,1fr);gap:14px;align-items:start}
.journal{grid-column:1/-1}
@media (max-width:1180px){.work{grid-template-columns:176px minmax(0,1fr)}.schem-pane{grid-column:2}}
@media (max-width:760px){.work{grid-template-columns:minmax(0,1fr)}.schem-pane{grid-column:auto}}
.pane-title{margin:0;font:600 .98rem/1.2 var(--font-display)}

.shelf{background:var(--wood);border:3px solid var(--wood-dark);border-radius:10px;padding:10px 8px 12px;color:var(--shelf-ink);min-width:0}
.shelf h2{margin:0 4px 8px;font:600 .98rem/1.2 var(--font-display);color:var(--shelf-ink)}
.planks{display:grid;gap:4px}
.plank{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:6px 4px 4px;border-bottom:7px solid var(--wood-dark);box-shadow:0 1px 0 var(--wood-light)}
.item{display:grid;justify-items:center;align-content:start;gap:2px;background:var(--case);border:1px solid var(--case-edge);border-radius:8px;padding:4px 3px 5px;color:var(--ink);touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;min-width:0}
.item svg{width:100%;height:auto;max-width:78px;display:block;pointer-events:none}
.item span{font-size:.74rem;line-height:1.15;text-align:center;pointer-events:none;overflow-wrap:anywhere;hyphens:manual;max-width:100%}
.item:hover{border-color:var(--accent)}
.shelf-note{margin:10px 4px 0;font-size:.8rem;line-height:1.35;color:var(--shelf-ink)}
@media (max-width:760px){.planks{display:flex;overflow-x:auto;gap:0}.plank{flex:none;width:176px}}

.bench,.schem-pane{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;min-width:0}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;padding:8px 10px;border-bottom:1px solid var(--line)}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:5px 11px;font-size:.9rem;color:var(--ink)}
.btn:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover:not(:disabled){color:var(--accent-ink);filter:brightness(1.08)}
.btn.armed,.btn.warn{border-color:var(--bad);color:var(--bad)}
.hint{color:var(--muted);font-size:.86rem;flex:1 1 220px;min-width:0;line-height:1.3}
.stage{position:relative;background:var(--board-edge)}
#bench{display:block;width:100%;height:auto;max-height:76vh;touch-action:none;user-select:none;-webkit-user-select:none}
#schem{display:block;width:100%;height:auto;background:var(--paper)}
.alerts{position:absolute;left:10px;top:10px;display:grid;gap:6px;max-width:min(440px,60%);pointer-events:none}
.alert{padding:7px 10px;border-radius:8px;font-size:.88rem;line-height:1.3;border:1px solid}
.alert.bad{background:var(--bad-soft);color:var(--bad);border-color:var(--bad)}
.alert.warn{background:var(--warn-soft);color:var(--warn);border-color:var(--warn)}
.example{margin:0;padding:7px 12px;background:var(--accent-soft);color:var(--ink);font-size:.88rem;line-height:1.3;border-top:1px solid var(--accent)}
.props{position:absolute;right:10px;bottom:10px;width:254px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:8px;font-size:.9rem;box-shadow:0 6px 18px rgba(0,0,0,.14)}
.props-head{display:flex;justify-content:space-between;align-items:center;gap:8px;font-family:var(--font-display)}
.x{border:0;background:transparent;font-size:1.35rem;line-height:1;padding:0 4px;color:var(--muted)}
.pf{margin:0;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.pn{margin:0;color:var(--muted);font-size:.84rem;line-height:1.3}
.props input[type=range]{width:100%;accent-color:var(--accent)}
.props select{padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:var(--panel);width:100%}
output,.mono{font-family:var(--font-mono);font-size:.88rem}
@media (max-width:760px){.alerts,.props{position:static;max-width:none;width:auto;margin:8px}.stage{background:var(--board)}}
.readouts{display:flex;flex-wrap:wrap;gap:6px 8px;padding:8px 10px;border-top:1px solid var(--line);font-size:.9rem;align-items:center}
.chip{font-family:var(--font-mono);font-size:.86rem;padding:3px 8px;border-radius:6px;background:var(--case-2);color:var(--ink);font-variant-numeric:tabular-nums}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.muted{color:var(--muted)}

.board{fill:var(--board)}
.dot{fill:var(--board-dot)}
.case{fill:var(--case);stroke:var(--case-edge);stroke-width:1.5}
.case-txt{font:600 11px var(--font-display);fill:var(--muted)}
.knob{fill:var(--case-2);stroke:var(--case-edge);stroke-width:1.2}
.knob-mark{stroke:var(--ink);stroke-width:2;stroke-linecap:round}
.lcd-bg{fill:#17231b}
.lcd{font:500 13px var(--font-mono);fill:#8fe07a}
.lcd.s{font-size:11.5px}
.lcd.alarm{fill:#ff8a7c}
.dial{fill:var(--dial);stroke:var(--case-edge);stroke-width:1}
.tick{stroke:var(--dial-ink);stroke-width:1}
.tick-lbl{font:700 8px var(--font-body);fill:var(--dial-ink)}
.unit{font:700 13px var(--font-display);fill:var(--dial-ink)}
.needle{stroke:var(--needle);stroke-width:2;stroke-linecap:round}
.hub{fill:var(--dial-ink)}
.wood{fill:var(--wood);stroke:var(--wood-dark);stroke-width:1.5}
.lead{stroke:var(--term-metal);stroke-width:3;stroke-linecap:round}
.knife{stroke:var(--term-metal);stroke-width:5;stroke-linecap:round}
.handle{fill:var(--term-black)}
.metal{fill:var(--term-metal);stroke:var(--case-edge);stroke-width:1}
.ceramic{fill:#dcc7a3;stroke:var(--wood-dark);stroke-width:1}
.coil{stroke:var(--coil);stroke-width:1.2}
.rail{stroke:var(--term-metal);stroke-width:3;stroke-linecap:round}
.socket{fill:var(--case-2);stroke:var(--case-edge);stroke-width:1}
.bulb{fill:var(--glass);stroke:var(--case-edge);stroke-width:1}
.fil{fill:none;stroke-width:1.4;stroke-linejoin:round}
.post{stroke:var(--case-edge);stroke-width:1.2}
.post.red{fill:var(--term-red)}.post.black{fill:var(--term-black)}.post.metal{fill:var(--term-metal)}
.hole{fill:var(--case-edge)}
.sign{font:700 12px var(--font-body)}
.sign.p{fill:var(--term-red)}.sign.m{fill:var(--ink)}
.term{cursor:crosshair}
.term .hit{fill:transparent}
.term:hover .post,.term.active .post{stroke:var(--accent);stroke-width:3}
.comp{cursor:grab}
.sel-box{fill:none;stroke:var(--accent);stroke-width:1.5;stroke-dasharray:5 4}
.wire{cursor:grab}
.w-handle{fill:var(--accent);stroke:var(--panel);stroke-width:2.5;cursor:grab}
.w-handle-ring{fill:none;stroke:var(--accent);stroke-width:1.5;opacity:.45;pointer-events:none}
.w-flow{fill:none;stroke:var(--flow);stroke-width:3.6;stroke-linecap:round;stroke-dasharray:.1 14;pointer-events:none}
.s-flow{fill:none;stroke:var(--accent);stroke-width:4;stroke-linecap:round;stroke-dasharray:.1 16;pointer-events:none}
.fuse-glass{fill:var(--glass);stroke:var(--case-edge);stroke-width:1}
.fuse-wire{fill:none;stroke:#8b949e;stroke-width:1.6}
.ruler{fill:#eadba9;stroke:var(--wood-dark);stroke-width:1}
.ruler-tick{stroke:#6b5a2e;stroke-width:1}
.res-wire{fill:none;stroke-linecap:round}
.btn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.mt td.txt{font-size:.84rem;white-space:nowrap}
.w-hit{fill:none;stroke:transparent;stroke-width:16;pointer-events:stroke}
.w-edge{fill:none;stroke:var(--wire-edge);stroke-width:7;stroke-linecap:round;pointer-events:none}
.w-core{fill:none;stroke-width:4.5;stroke-linecap:round;pointer-events:none}
.wire.sel .w-edge{stroke:var(--accent);stroke-width:10}
.lbl{font:700 13px var(--font-body);fill:var(--ink);paint-order:stroke;stroke:var(--board);stroke-width:3px;pointer-events:none}
#rubber{fill:none;stroke:var(--accent);stroke-width:3;stroke-dasharray:6 5;pointer-events:none}

.sheet-grid{stroke:var(--paper-grid);stroke-width:1}
.s-line{fill:none;stroke:var(--ink);stroke-width:2.2;stroke-linecap:square;stroke-linejoin:miter}
.s-thick{stroke-width:6}
.s-sym{fill:var(--paper);stroke:var(--ink);stroke-width:2.2}
.s-fill{fill:var(--ink)}
.s-txt{font:700 16px var(--font-body);fill:var(--ink)}
.s-lbl{font:700 14px var(--font-body);fill:var(--ink)}
.s-val{font:13px var(--font-body);fill:var(--muted)}
.s-bad{fill:var(--bad)!important}
.s-comp{cursor:pointer}
.s-comp:hover .s-sym,.s-comp:hover .s-line{stroke:var(--accent)}
.s-comp.sel .s-sym,.s-comp.sel .s-line,.s-line.sel{stroke:var(--accent)}
.s-comp.sel .s-fill{fill:var(--accent)}
.s-comp.sel text{fill:var(--accent)}
.s-empty{font:15px var(--font-body);fill:var(--muted)}

.journal{container-type:inline-size;position:relative;background-color:var(--paper);background-image:linear-gradient(var(--paper-grid) 1px,transparent 1px),linear-gradient(90deg,var(--paper-grid) 1px,transparent 1px);background-size:18px 18px;border:1px solid var(--line);border-radius:12px;padding:16px 18px 20px 42px;min-width:0}
.journal::before{content:"";position:absolute;top:0;bottom:0;left:28px;width:2px;background:var(--paper-margin)}
.j-num{font:500 .8rem var(--font-display);letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.journal h2{margin:2px 0 12px;font:600 1.3rem/1.2 var(--font-display);text-wrap:balance}
.journal h3{margin:0 0 6px;font:600 .95rem var(--font-display)}
.j-body{display:grid;gap:18px}
@container (min-width:820px){.j-body{grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);align-items:start}}
.j-col{display:grid;gap:16px;min-width:0}
.journal p{margin:0;line-height:1.45}
.journal ul,.journal ol{margin:0;padding-left:1.25em;line-height:1.45}
.journal ol li+li{margin-top:4px}
.schem svg{width:100%;max-width:340px;height:auto;display:block}
.sc{fill:var(--paper)}.sb{fill:var(--paper);stroke:var(--ink);stroke-width:1.6}.sw{fill:none;stroke:var(--ink);stroke-width:1.6}.sw.thick{stroke-width:3.4}.sd{fill:var(--ink)}
.sm{font:700 11px var(--font-body);fill:var(--ink);text-anchor:middle}
.st{font:11px var(--font-body);fill:var(--muted);text-anchor:middle}
.stt{font:700 11.5px var(--font-body);fill:var(--ink)}
.tbl-wrap{overflow-x:auto;max-width:100%}
.mt{border-collapse:collapse;background:var(--paper);font-variant-numeric:tabular-nums}
.mt th,.mt td{border:1px solid var(--case-edge);padding:4px 5px;text-align:center;vertical-align:middle}
.mt th{font-weight:700;font-size:.86rem;line-height:1.2}
.mt th small{display:block;font-weight:400;color:var(--muted);font-size:.72rem;margin-top:2px}
.mt th.calc{background:var(--accent-soft)}
.mt td.rl{text-align:left;font-size:.84rem;line-height:1.25;min-width:150px}
.mt input,.mt select{width:64px;padding:3px 4px;border:1px solid var(--line);border-radius:5px;background:var(--panel);text-align:center;font-family:var(--font-mono);font-size:.86rem}
.mt select{width:72px;font-family:var(--font-body)}
.mt input.ok{border-color:var(--ok);background:var(--ok-soft)}
.mt input.bad{border-color:var(--bad);background:var(--bad-soft)}
.mt .rec{font-size:.8rem;padding:3px 8px;white-space:nowrap}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.checks{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:5px;font-size:.9rem}
.checks:empty{display:none}
.checks li{display:flex;gap:8px;align-items:flex-start;line-height:1.3}
.checks .mk{flex:none;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-size:.72rem;font-weight:700;color:var(--panel);margin-top:1px}
.checks .ok .mk{background:var(--ok)}.checks .bad .mk{background:var(--bad)}
.checks .ok.sum{color:var(--ok);font-weight:700}
.graph svg{width:100%;max-width:440px;height:auto;display:block}
.g-axis{stroke:var(--ink);stroke-width:1.2}
.g-grid{stroke:var(--line);stroke-width:1}
.g-lbl{font:11px var(--font-body);fill:var(--muted)}
.g-ttl{font:700 12px var(--font-body);fill:var(--ink)}
.g-pt{fill:var(--accent);stroke:var(--paper);stroke-width:1.5}
.g-line{stroke:var(--accent);stroke-width:2;fill:none}
.g-fit{stroke:var(--accent);stroke-width:1.5;stroke-dasharray:6 4;fill:none}
textarea{width:100%;min-height:92px;resize:vertical;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);line-height:1.45}
details{margin-top:6px;font-size:.9rem}
summary{cursor:pointer;color:var(--accent)}
details p{margin-top:6px!important}
.copy-msg{font-size:.88rem;color:var(--ok)}
.about{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;display:grid;gap:18px;grid-template-columns:minmax(0,1fr) 240px;align-items:start}
.about.big{grid-template-columns:minmax(0,1fr) 390px}
@media (max-width:760px){.about,.about.big{grid-template-columns:minmax(0,1fr)}}
.about h2{margin:0;font:600 1.25rem/1.2 var(--font-display);text-wrap:balance}
.about h3{margin:0 0 4px;font:600 .95rem var(--font-display);color:var(--accent)}
.about p{margin:0;line-height:1.5}
.about ul,.about ol{margin:0;padding-left:1.25em;line-height:1.45}
.about-text{display:grid;gap:14px;min-width:0}
.about-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.about-head img{width:64px;height:64px;border-radius:50%;flex:none}
.about-head .muted{margin-top:2px}
.about-cols{display:grid;gap:14px 26px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.qr-card{display:grid;gap:8px;justify-items:center;text-align:center;border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--bg)}
.qr-box{width:100%;max-width:216px;background:#fff;border-radius:8px;padding:4px}
.about.big .qr-box{max-width:366px}
.qr-box svg{display:block;width:100%;height:auto}
.qr-url{font-family:var(--font-mono);font-size:.74rem;word-break:break-all;color:var(--muted)}
.qr-card .actions{margin-top:0;justify-content:center}
.extra{background:var(--accent-soft);border:1px solid var(--accent);border-radius:10px;padding:10px 14px}
.extra h3{color:var(--accent)}

function termLocal(c,k){
 const T=TYPES[c.type],s=k===0?-1:1,r=((c.rot%360)+360)%360;
 if(T.up){
  if(r===0)return [s*(T.hw+8),0];
  if(r===180)return [-s*(T.hw+8),0];
  if(r===90)return [0,s*(T.hh+12)];
  return [0,-s*(T.hh+12)];
 }
 const a=r*Math.PI/180;return [Math.round(s*T.tl*Math.cos(a)),Math.round(s*T.tl*Math.sin(a))];
}
const termPos=(c,k)=>{const l=termLocal(c,k);return [c.x+l[0],c.y+l[1]];};
const rotV=(rot,x,y)=>{const a=rot*Math.PI/180,co=Math.round(Math.cos(a)),si=Math.round(Math.sin(a));return [x*co-y*si,x*si+y*co];};
function rotBox(c){
 const T=TYPES[c.type],[x0,y0,x1,y1]=T.box;
 if(T.up)return [x0,y0,x1,y1];
 const pts=[[x0,y0],[x1,y0],[x0,y1],[x1,y1]].map(([x,y])=>rotV(c.rot,x,y));
 return [Math.min(...pts.map(p=>p[0])),Math.min(...pts.map(p=>p[1])),Math.max(...pts.map(p=>p[0])),Math.max(...pts.map(p=>p[1]))];
}

function solve(){
 const comps=S.comps,parent={};
 const find=x=>{while(parent[x]!==x){parent[x]=parent[parent[x]];x=parent[x];}return x;};
 comps.forEach(c=>{[0,1].forEach(k=>{const id=c.id+':'+k;parent[id]=id;});});
 S.wires.forEach(w=>{if(parent[w.a]===undefined||parent[w.b]===undefined)return;const a=find(w.a),b=find(w.b);if(a!==b)parent[a]=b;});
 const roots={},nodeOf={},eNode={};let ng=0,n=0;
 Object.keys(parent).forEach(k=>{const r=find(k);if(roots[r]===undefined)roots[r]=ng++;nodeOf[k]=roots[r];eNode[k]=n++;});
 const tripped=new Set();let res=nodal(n,eNode,tripped);
 for(let it=0;it<10;it++){
  let ch=false;
  comps.forEach(c=>{if(c.type==='fuse'&&!c.props.blown){const r=res.el[c.id];if(r&&Math.abs(r.I)>c.props.rating*1.0001){c.props.blown=true;ch=true;}}});
  if(ch){res=nodal(n,eNode,tripped);continue;}
  comps.forEach(c=>{if(c.type==='source'&&!tripped.has(c.id)){const r=res.el[c.id];if(r&&Math.abs(r.I)>LIMIT){tripped.add(c.id);ch=true;}}});
  if(ch){res=nodal(n,eNode,tripped);continue;}
  comps.forEach(c=>{if(c.type==='lamp'&&!c.props.burned){const r=res.el[c.id];if(r&&r.P>LAMP_BURN){c.props.burned=true;c.props.cause='over';ch=true;}}});
  if(ch){res=nodal(n,eNode,tripped);continue;}
  break;
 }
 res.tripped=tripped;res.nodeOf=nodeOf;
 /* ohmmeter: the meter itself carries no circuit current; its reading is the equivalent resistance
    between its terminals, found with a 1 A test current and every supply switched off */
 res.ohm={};
 comps.filter(c=>c.type==='ohmmeter').forEach(c=>{

let drag=null;
svg.addEventListener('pointerdown',e=>{

 if(term){
  const id=term.dataset.term;e.preventDefault();
  if(S.pending&&S.pending!==id){addWire(S.pending,id);S.pending=null;hideRubber();render();save();return;}
  S.pending=null;drag={kind:'wire',from:id,sx:p.x,sy:p.y,moved:false};
  try{svg.setPointerCapture(e.pointerId);}catch(_){}
  showRubber(id,p);return;
 }
 if(S.pending){S.pending=null;hideRubber();}
 if(comp){
  const c=getComp(comp.dataset.comp);if(!c)return;e.preventDefault();
  S.sel={kind:'comp',id:c.id};
  drag={kind:'move',id:c.id,ox:p.x-c.x,oy:p.y-c.y,sx:p.x,sy:p.y,moved:false};
  try{svg.setPointerCapture(e.pointerId);}catch(_){}
  render();return;
 }
 if(wire){
  const w=S.wires.find(x=>x.id===wire.dataset.wire);if(!w)return;e.preventDefault();
  S.sel={kind:'wire',id:w.id};
  const en=wireEnds(w),off=en?wireOff(en[0],en[1],w):[0,0];
  drag={kind:'bend',id:w.id,sx:p.x,sy:p.y,off0:[off[0],off[1]],moved:false};
  try{svg.setPointerCapture(e.pointerId);}catch(_){}
  render();return;
 }
 S.sel=null;render();
});
svg.addEventListener('pointermove',e=>{
 const p=pt(e);
 if(drag&&drag.kind==='move'){
  if(!drag.moved&&Math.hypot(p.x-drag.sx,p.y-drag.sy)<4)return;
  drag.moved=true;const c=getComp(drag.id);if(!c)return;
  const nx=clampX(snap(p.x-drag.ox)),ny=clampY(snap(p.y-drag.oy));
  if(nx!==c.x||ny!==c.y){c.x=nx;c.y=ny;renderBench();}
 }else if(drag&&drag.kind==='bend'){
  if(!drag.moved&&Math.hypot(p.x-drag.sx,p.y-drag.sy)<4)return;
  drag.moved=true;const w=S.wires.find(x=>x.id===drag.id),en=w&&wireEnds(w);if(!en)return;
  const mx=(en[0][0]+en[1][0])/2,my=(en[0][1]+en[1][1])/2;
  const hx=Math.max(12,Math.min(W-12,mx+drag.off0[0]+p.x-drag.sx)),hy=Math.max(12,Math.min(H-12,my+drag.off0[1]+p.y-drag.sy));
  w.off=[Math.round(hx-mx),Math.round(hy-my)];renderBench();
 }else if(drag&&drag.kind==='wire'){
  if(Math.hypot(p.x-drag.sx,p.y-drag.sy)>6)drag.moved=true;showRubber(drag.from,p);
 }else if(S.pending)showRubber(S.pending,p);

 sdrag={spec,sx:e.clientX,sy:e.clientY,moved:false};
 try{it.setPointerCapture(e.pointerId);}catch(_){}
});
shelfEl.addEventListener('pointermove',e=>{
 if(!sdrag)return;
 if(!sdrag.moved&&Math.hypot(e.clientX-sdrag.sx,e.clientY-sdrag.sy)>5){sdrag.moved=true;ghost.hidden=false;}
 if(sdrag.moved)moveGhost(e);
});
shelfEl.addEventListener('pointerup',e=>{
 if(!sdrag)return;const d=sdrag;sdrag=null;ghost.hidden=true;
 const r=svg.getBoundingClientRect(),inside=e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom;
 if(d.moved){if(inside){const p=pt(e);place(d.spec,clampX(snap(p.x)),clampY(snap(p.y)));}}
 else{const [x,y]=freeSpot();place(d.spec,x,y);}

const SC={
 w:pts=>`<polyline points="${pts.map(p=>p.join(',')).join(' ')}" class="sw"/>`,
 res:(x,y,l)=>`<rect x="${x-16}" y="${y-6}" width="32" height="12" class="sb"/>${l?`<text x="${x}" y="${y+21}" class="st">${l}</text>`:''}`,
 lamp:(x,y,l)=>`<circle cx="${x}" cy="${y}" r="9" class="sb"/><path d="M${x-6.4},${y-6.4}L${x+6.4},${y+6.4}M${x-6.4},${y+6.4}L${x+6.4},${y-6.4}" class="sw"/>${l?`<text x="${x}" y="${y-14}" class="st">${l}</text>`:''}`,
 m:(x,y,l)=>`<circle cx="${x}" cy="${y}" r="10.5" class="sb"/><text x="${x}" y="${y+4}" class="sm">${l}</text>`,
 src:(x,y)=>`<rect x="${x-6}" y="${y-13}" width="12" height="26" class="sc"/><line x1="${x-4}" y1="${y-12}" x2="${x-4}" y2="${y+12}" class="sw"/><line x1="${x+4}" y1="${y-6}" x2="${x+4}" y2="${y+6}" class="sw thick"/><text x="${x-12}" y="${y-9}" class="st">+</text>`,
 key:(x,y)=>`<rect x="${x-13}" y="${y-11}" width="26" height="13" class="sc"/><line x1="${x-12}" y1="${y}" x2="${x+10}" y2="${y-10}" class="sw"/><circle cx="${x-12}" cy="${y}" r="2.2" class="sd"/><circle cx="${x+12}" cy="${y}" r="2.2" class="sd"/>`,
 dot:(x,y)=>`<circle cx="${x}" cy="${y}" r="2.8" class="sd"/>`,
 vb:(x1,x2,y,yv,l)=>SC.w([[x1,y],[x1,yv],[x2,yv],[x2,y]])+SC.m((x1+x2)/2,yv,l)+SC.dot(x1,y)+SC.dot(x2,y),
 tt:(x,y,s)=>`<text x="${x}" y="${y}" class="stt">${s}</text>`
};
const svgWrap=(w,h,s)=>`<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(t('scheme'))}">${s}</svg>`;
SC.fuse=(x,y,l)=>`<rect x="${x-14}" y="${y-5}" width="28" height="10" class="sb"/><line x1="${x-14}" y1="${y}" x2="${x+14}" y2="${y}" class="sw"/>${l?`<text x="${x}" y="${y+20}" class="st">${l}</text>`:''}`;
function schemSimple(loadLamp,lbl,withFuse){
 const bottom=withFuse?SC.src(95,160)+SC.fuse(165,160,'FU')+SC.key(235,160):SC.src(130,160)+SC.key(220,160);
 return svgWrap(320,185,SC.w([[30,90],[290,90],[290,160],[30,160],[30,90]])+(loadLamp?SC.lamp(120,90):SC.res(120,90,lbl||'R'))+SC.vb(85,155,90,40,'V')+SC.m(220,90,'A')+bottom);
}
function schemBurn(){
 const L1=t('lampPre')+'1',L2=t('lampPre')+'2';
 let s=SC.tt(10,16,t('d1'))+SC.w([[40,70],[290,70],[290,125],[40,125],[40,70]])+SC.lamp(100,70,'')+SC.lamp(180,70,'')+SC.vb(150,210,70,34,'V')+SC.m(250,70,'A')+SC.src(130,125)+SC.key(210,125)
  +`<text x="100" y="94" class="st">${L1}</text><text x="180" y="94" class="st">${L2}</text>`;
 s+=SC.tt(10,166,t('d2'))+SC.w([[90,195],[230,195]])+SC.w([[90,235],[230,235]])+SC.w([[90,195],[90,272]])+SC.w([[230,195],[230,272]])
  +SC.w([[90,195],[40,195],[40,300],[290,300],[290,195],[230,195]])
  +SC.lamp(160,195,'')+SC.lamp(160,235,'')+`<text x="190" y="190" class="st">${L1}</text><text x="190" y="230" class="st">${L2}</text>`
  +SC.w([[90,272],[230,272]])+SC.m(160,272,'V')+SC.dot(90,195)+SC.dot(230,195)+SC.dot(90,235)+SC.dot(230,235)
  +SC.src(110,300)+SC.key(175,300)+SC.m(245,300,'A');
 return svgWrap(320,320,s);
}

  kz:['Тізбекті жинаңыз: ток көзі, кілт, A1 амперметрі және Rx1 өткізгіші тізбектей жалғанады. V1 вольтметрін өткізгішке параллель қосыңыз. Ток көзінің кернеуі — 1,5 В.','Өткізгішті басып, мына мәндерді қойыңыз: нихром, S = 0,2 мм², L = 0,25 м. Кілтті тұйықтап, 1-жолдағы «Жазу» батырмасын басыңыз.','Тәжірибені 0,5 м және 1,0 м ұзындықпен қайталаңыз (2 және 3-жолдар). Ұзындық артқанда кедергі қалай өзгереді?','Нихром, L = 1,0 м, бірақ S = 0,4 мм² — 4-жол. 3-жолмен салыстырыңыз.','Константан, L = 1,0 м, S = 0,2 мм² — 5-жол. 3-жолмен салыстырыңыз.','R = U / I кедергісін және ρ = R·S / L меншікті кедергісін есептеңіз. ρ мәнін кестедегі мәндермен салыстырыңыз: нихром — 1,1, константан — 0,5 Ом·мм²/м.'],
  en:['Assemble the circuit: power supply, switch, ammeter A1 and conductor Rx1 in series. Connect voltmeter V1 in parallel with the conductor. Set the supply voltage to 1.5 V.','Click the conductor and set: nichrome, S = 0.2 mm², L = 0.25 m. Close the switch and press “Record” in row 1.','Repeat with lengths 0.5 m and 1.0 m (rows 2 and 3). How does the resistance change as the length increases?','Nichrome, L = 1.0 m, but S = 0.4 mm² — row 4. Compare with row 3.','Constantan, L = 1.0 m, S = 0.2 mm² — row 5. Compare with row 3.','Calculate R = U / I and the resistivity ρ = R·S / L. Compare ρ with the table values: nichrome 1.1, constantan 0.5 Ω·mm²/m.']},
 cols:[{id:'M',head:'@mat',src:'prop:mat',text:true},{id:'L',head:'L, @m',src:'prop:L'},{id:'S',head:'S, @mm2',src:'prop:S'},{id:'U',head:'U, @V',src:'V1'},{id:'I',head:'I, @A',src:'A1'},{id:'R',head:'R = U/I, @Ohm',calc:m=>m.U/m.I},{id:'P',head:'ρ = R·S/L, @rho',calc:m=>m.U/m.I*m.S/m.L}],rows:5,
 hint:{ru:'Сопротивление проводника прямо пропорционально его длине и обратно пропорционально площади поперечного сечения: R = ρ·L / S. Оно зависит и от вещества: у константана удельное сопротивление меньше, чем у нихрома. Поэтому провода делают из меди и алюминия — у них ρ очень мало (у меди 0,017 Ом·мм²/м).',
  kz:'Өткізгіштің кедергісі оның ұзындығына тура пропорционал, ал көлденең қимасының ауданына кері пропорционал: R = ρ·L / S. Ол затқа да тәуелді: константанның меншікті кедергісі нихромнікінен кіші. Сондықтан сымдарды мыс пен алюминийден жасайды — олардың ρ мәні өте аз (мыстікі 0,017 Ом·мм²/м).',
  en:'The resistance of a conductor is directly proportional to its length and inversely proportional to its cross-sectional area: R = ρ·L / S. It also depends on the material: constantan has a lower resistivity than nichrome. That is why wires are made of copper and aluminium — their ρ is very small (copper: 0.017 Ω·mm²/m).'},
 schem:()=>schemSimple(false,'Rx'),
 check:add=>{const ls=loads(['cond']);if(!ls.length){add(false,'cNeedCond');return;}const L=pick(ls);chkAmm(add,'A1',L,'@insCond');chkVolt(add,'V1',L,'@datCond');}
},
{
 tab:{ru:'Последовательное',kz:'Тізбектей',en:'Series'},
 title:{ru:'Последовательное соединение проводников',kz:'Өткізгіштерді тізбектей жалғау',en:'Series connection of conductors'},
 goal:{ru:'Проверить, что при последовательном соединении сила тока одинакова, общее напряжение равно сумме напряжений (U = U₁ + U₂), а общее сопротивление — сумме сопротивлений (R = R₁ + R₂).',
  kz:'Тізбектей жалғағанда ток күші бірдей болатынын, жалпы кернеу кернеулердің қосындысына (U = U₁ + U₂), ал жалпы кедергі кедергілердің қосындысына (R = R₁ + R₂) тең екенін тексеру.',
  en:'Check that in a series connection the current is the same, the total voltage equals the sum of the voltages (U = U₁ + U₂) and the total resistance equals the sum of the resistances (R = R₁ + R₂).'},
 equip:{ru:['источник тока','ключ','резисторы 2 Ом и 4 Ом','амперметр','три вольтметра','соединительные провода'],kz:['ток көзі','кілт','2 Ом және 4 Ом резисторлар','амперметр','үш вольтметр','жалғағыш сымдар'],en:['power supply','switch','2 Ω and 4 Ω resistors','ammeter','three voltmeters','connecting wires']},
 steps:{ru:['Соберите цепь: источник тока, ключ, амперметр A1 и два резистора (2 Ом и 4 Ом), соединённые последовательно.','Подключите вольтметр V1 параллельно первому резистору, V2 — второму, V3 — обоим резисторам сразу.','Установите напряжение 3 В, замкните ключ и запишите показания в строку 1.','Установите напряжение 6 В и запишите показания в строку 2.','Вычислите U₁ + U₂ и общее сопротивление R = U / I. Сравните U₁ + U₂ с U, а R — с R₁ + R₂.'],
  kz:['Тізбекті жинаңыз: ток көзі, кілт, A1 амперметрі және екі резистор (2 Ом және 4 Ом) тізбектей жалғанады.','V1 вольтметрін бірінші резисторға, V2-ні екіншісіне, V3-ті екі резисторға бірден параллель қосыңыз.','Кернеуді 3 В етіп қойып, кілтті тұйықтаңыз және көрсеткіштерді 1-жолға жазыңыз.','Кернеуді 6 В етіп қойып, көрсеткіштерді 2-жолға жазыңыз.','U₁ + U₂ қосындысын және жалпы кедергі R = U / I есептеңіз. U₁ + U₂ мәнін U-мен, ал R мәнін R₁ + R₂-мен салыстырыңыз.'],
  en:['Assemble the circuit: power supply, switch, ammeter A1 and two resistors (2 Ω and 4 Ω) connected in series.','Connect voltmeter V1 in parallel with the first resistor, V2 with the second, and V3 across both resistors together.','Set the voltage to 3 V, close the switch and record the readings in row 1.','Set the voltage to 6 V and record the readings in row 2.','Calculate U₁ + U₂ and the total resistance R = U / I. Compare U₁ + U₂ with U, and R with R₁ + R₂.']},
 cols:[{id:'I',head:'I, @A',src:'A1'},{id:'U1',head:'U<sub>1</sub>, @V',src:'V1'},{id:'U2',head:'U<sub>2</sub>, @V',src:'V2'},{id:'U',head:'U, @V',src:'V3'},{id:'S',head:'U<sub>1</sub> + U<sub>2</sub>, @V',calc:m=>m.U1+m.U2},{id:'R',head:'R = U/I, @Ohm',calc:m=>m.U/m.I}],rows:2,
 hint:{ru:'При последовательном соединении сила тока во всех проводниках одинакова, общее напряжение равно сумме напряжений: U = U₁ + U₂, а общее сопротивление равно сумме сопротивлений: R = R₁ + R₂.',
  kz:'Тізбектей жалғағанда барлық өткізгіштердегі ток күші бірдей, жалпы кернеу кернеулердің қосындысына тең: U = U₁ + U₂, ал жалпы кедергі кедергілердің қосындысына тең: R = R₁ + R₂.',
  en:'In a series connection the current in all conductors is the same, the total voltage equals the sum of the voltages, U = U₁ + U₂, and the total resistance equals the sum of the resistances, R = R₁ + R₂.'},
 extra:{ru:'Правило U = U₁ + U₂, которое вы проверили, — частный случай второго закона Кирхгофа (1845 г.): в любом замкнутом контуре сумма напряжений на участках цепи равна напряжению источника. Обойдите контур «источник → R₁ → R₂ → источник»: напряжение источника распределяется между резисторами, при 6 В получается 6 В = 2 В + 4 В. Подробно законы Кирхгофа изучают в старших классах, а наша виртуальная лаборатория рассчитывает каждую цепь именно по ним.',
  kz:'Сіз тексерген U = U₁ + U₂ ережесі — Кирхгофтың екінші заңының (1845 ж.) дербес жағдайы: кез келген тұйық контурда тізбек бөліктеріндегі кернеулердің қосындысы ток көзінің кернеуіне тең. «Ток көзі → R₁ → R₂ → ток көзі» контурын айналып шығыңыз: ток көзінің кернеуі резисторлар арасында бөлінеді, 6 В кезінде 6 В = 2 В + 4 В шығады. Кирхгоф заңдарын жоғары сыныптарда толық оқиды, ал біздің виртуалды зертхана әр тізбекті дәл осы заңдар бойынша есептейді.',
  en:'The rule U = U₁ + U₂ that you have checked is a special case of Kirchhoff’s second law (1845): around any closed loop, the sum of the voltages across the parts of the circuit equals the supply voltage. Go round the loop “supply → R₁ → R₂ → supply”: the supply voltage is shared between the resistors, and at 6 V you get 6 V = 2 V + 4 V. Kirchhoff’s laws are studied in detail in senior grades, and this virtual lab calculates every circuit with exactly these laws.'},
 schem:()=>svgWrap(320,200,SC.w([[30,120],[290,120],[290,180],[30,180],[30,120]])+SC.res(110,120,'R₁')+SC.res(210,120,'R₂')+SC.vb(80,140,120,78,'V₁')+SC.vb(180,240,120,78,'V₂')+SC.vb(60,260,120,26,'V₃')+SC.src(100,180)+SC.key(170,180)+SC.m(240,180,'A')),
 check:add=>{
  const ls=loads(['resistor','rheostat']).filter(c=>Math.abs(R(c).I)>1e-4),Is=srcI();let pr=null;
  for(let i=0;i<ls.length&&!pr;i++)for(let j=i+1;j<ls.length&&!pr;j++){const a=ls[i],b=ls[j];if(ap(Math.abs(R(a).I),Math.abs(R(b).I))&&ap(Is,Math.abs(R(a).I)))pr=[a,b];}
  if(!pr){add(false,'cSerBad');return;}add(true,'cSerOk');
  const [a,b]=pr,Ia=Math.abs(R(a).I),Ua=Math.abs(R(a).U),Ub=Math.abs(R(b).U);
  const A1=meter('A1');if(!A1)add(false,'cNeedMeter',{m:'A1'});else{const ok=ap(Math.abs(R(A1).I),Ia);add(ok,ok?'cAmmOk':'cAmmBad',{m:'A1',x:'@insResPl'});pol(add,A1);}
  const V1=meter('V1'),V2=meter('V2'),V3=meter('V3');
  if(!V1||!V2)add(false,'cNeedMeter',{m:!V1?'V1':'V2'});
  else{const u1=Math.abs(R(V1).U),u2=Math.abs(R(V2).U),ok=(ap(u1,Ua)&&ap(u2,Ub))||(ap(u1,Ub)&&ap(u2,Ua));add(ok,ok?'cV12Ok':'cV12Bad');pol(add,V1);pol(add,V2);}
  if(!V3)add(false,'cNeedMeter',{m:'V3'});else{const ok=ap(Math.abs(R(V3).U),Ua+Ub);add(ok,ok?'cV3Ok':'cV3Bad');pol(add,V3);}
 }
},
{
 tab:{ru:'Параллельное',kz:'Параллель',en:'Parallel'},
 title:{ru:'Параллельное соединение проводников',kz:'Өткізгіштерді параллель жалғау',en:'Parallel connection of conductors'},
 goal:{ru:'Проверить, что при параллельном соединении напряжение на проводниках одинаково, общий ток равен сумме токов в ветвях (I = I₁ + I₂), а общее сопротивление меньше сопротивления каждого проводника.',
  kz:'Параллель жалғағанда өткізгіштердегі кернеу бірдей болатынын, жалпы ток тармақтардағы токтардың қосындысына тең (I = I₁ + I₂), ал жалпы кедергі әр өткізгіштің кедергісінен кіші екенін тексеру.',
  en:'Check that in a parallel connection the voltage across the conductors is the same, the total current equals the sum of the branch currents (I = I₁ + I₂), and the total resistance is less than that of each conductor.'},
 equip:{ru:['источник тока','ключ','резисторы 4 Ом и 6 Ом','три амперметра','вольтметр','соединительные провода'],kz:['ток көзі','кілт','4 Ом және 6 Ом резисторлар','үш амперметр','вольтметр','жалғағыш сымдар'],en:['power supply','switch','4 Ω and 6 Ω resistors','three ammeters','voltmeter','connecting wires']},
 steps:{ru:['Соедините резисторы 4 Ом и 6 Ом параллельно. В каждую ветвь последовательно с резистором включите амперметр: A2 — к первому, A3 — ко второму.','Подключите разветвление к источнику через ключ и амперметр A1 — он измеряет общий ток.','Подключите вольтметр V1 параллельно резисторам.','Установите напряжение 3 В, замкните ключ и запишите показания в строку 1. Повторите при 4,5 В (строка 2).','Вычислите I₁ + I₂ и R = U / I. Сравните I₁ + I₂ с I, а R — с сопротивлениями резисторов.'],
  kz:['4 Ом және 6 Ом резисторларды параллель жалғаңыз. Әр тармаққа резистормен тізбектей амперметр қосыңыз: A2 — біріншісіне, A3 — екіншісіне.','Тармақталуды ток көзіне кілт және A1 амперметрі арқылы қосыңыз — ол жалпы токты өлшейді.','V1 вольтметрін резисторларға параллель қосыңыз.','Кернеуді 3 В етіп қойып, кілтті тұйықтаңыз және көрсеткіштерді 1-жолға жазыңыз. 4,5 В кернеуде қайталаңыз (2-жол).','I₁ + I₂ қосындысын және R = U / I есептеңіз. I₁ + I₂ мәнін I-мен, ал R мәнін резисторлардың кедергілерімен салыстырыңыз.'],
  en:['Connect the 4 Ω and 6 Ω resistors in parallel. Put an ammeter in series with the resistor in each branch: A2 with the first, A3 with the second.','Connect the branches to the supply through the switch and ammeter A1 — it measures the total current.','Connect voltmeter V1 in parallel with the resistors.','Set the voltage to 3 V, close the switch and record the readings in row 1. Repeat at 4.5 V (row 2).','Calculate I₁ + I₂ and R = U / I. Compare I₁ + I₂ with I, and R with the resistances of the resistors.']},
 cols:[{id:'U',head:'U, @V',src:'V1'},{id:'I',head:'I, @A',src:'A1'},{id:'I1',head:'I<sub>1</sub>, @A',src:'A2'},{id:'I2',head:'I<sub>2</sub>, @A',src:'A3'},{id:'S',head:'I<sub>1</sub> + I<sub>2</sub>, @A',calc:m=>m.I1+m.I2},{id:'R',head:'R = U/I, @Ohm',calc:m=>m.U/m.I}],rows:2,
 hint:{ru:'При параллельном соединении напряжение на всех проводниках одинаково, а общий ток равен сумме токов в ветвях: I = I₁ + I₂. Общее сопротивление меньше меньшего из сопротивлений: 1/R = 1/R₁ + 1/R₂.',
  kz:'Параллель жалғағанда барлық өткізгіштердегі кернеу бірдей, ал жалпы ток тармақтардағы токтардың қосындысына тең: I = I₁ + I₂. Жалпы кедергі ең кіші кедергіден де кіші: 1/R = 1/R₁ + 1/R₂.',
  en:'In a parallel connection the voltage across all conductors is the same, and the total current equals the sum of the branch currents: I = I₁ + I₂. The total resistance is smaller than the smallest resistance: 1/R = 1/R₁ + 1/R₂.'},
 extra:{ru:'Правило I = I₁ + I₂ — частный случай первого закона Кирхгофа: сумма токов, втекающих в узел (точку разветвления), равна сумме токов, вытекающих из него. Заряд в узле не накапливается и не исчезает: сколько тока пришло, столько и ушло. В нашей работе при 4,5 В получается 1,875 А = 1,125 А + 0,75 А. Включите «Показать ток» и посмотрите, как поток точек делится в узле на две ветви. А если обойти контур с любой из ветвей, выполняется второй закон Кирхгофа: напряжение и на R₁, и на R₂ равно напряжению источника.',
  kz:'I = I₁ + I₂ ережесі — Кирхгофтың бірінші заңының дербес жағдайы: түйінге (тармақталу нүктесіне) кіретін токтардың қосындысы одан шығатын токтардың қосындысына тең. Түйінде заряд жиналмайды да, жоғалмайды да: қанша ток кірсе, сонша ток шығады. Біздің жұмыста 4,5 В кезінде 1,875 А = 1,125 А + 0,75 А шығады. «Токты көрсету» батырмасын қосып, нүктелер ағынының түйінде екі тармаққа қалай бөлінетінін қараңыз. Ал кез келген тармағы бар контурды айналып өтсек, Кирхгофтың екінші заңы орындалады: R₁-дегі де, R₂-дегі де кернеу ток көзінің кернеуіне тең.',
  en:'The rule I = I₁ + I₂ is a special case of Kirchhoff’s first law: the sum of the currents flowing into a junction equals the sum of the currents flowing out of it. Charge neither piles up nor disappears at a junction: as much current comes in as goes out. In this lab at 4.5 V you get 1.875 A = 1.125 A + 0.75 A. Turn on “Show current” and watch the stream of dots split into two branches at the junction. And if you go round a loop through either branch, Kirchhoff’s second law holds: the voltage across R₁ and across R₂ equals the supply voltage.'},
 schem:()=>svgWrap(320,220,SC.w([[70,80],[250,80]])+SC.w([[70,130],[250,130]])+SC.w([[70,80],[70,190],[250,190],[250,80]])+SC.res(130,80,'R₁')+SC.m(200,80,'A₂')+SC.res(130,130,'R₂')+SC.m(200,130,'A₃')+SC.vb(70,250,80,34,'V')+SC.dot(70,130)+SC.dot(250,130)+SC.src(110,190)+SC.key(165,190)+SC.m(215,190,'A₁')),
 check:add=>{
  const ls=loads(['resistor','rheostat']).filter(c=>Math.abs(R(c).I)>1e-4),Is=srcI();let pr=null;
  for(let i=0;i<ls.length&&!pr;i++)for(let j=i+1;j<ls.length&&!pr;j++){const a=ls[i],b=ls[j];if(ap(Math.abs(R(a).U),Math.abs(R(b).U))&&ap(Is,Math.abs(R(a).I)+Math.abs(R(b).I)))pr=[a,b];}
  if(!pr){add(false,'cParBad');return;}add(true,'cParOk');
  const [a,b]=pr,Ia=Math.abs(R(a).I),Ib=Math.abs(R(b).I),Ua=Math.abs(R(a).U);
  const A1=meter('A1'),A2=meter('A2'),A3=meter('A3'),V1=meter('V1');
  if(!A1)add(false,'cNeedMeter',{m:'A1'});else{const ok=ap(Math.abs(R(A1).I),Ia+Ib);add(ok,ok?'cTotOk':'cTotBad');pol(add,A1);}
  if(!A2||!A3)add(false,'cNeedMeter',{m:!A2?'A2':'A3'});
  else{const i2=Math.abs(R(A2).I),i3=Math.abs(R(A3).I),ok=(ap(i2,Ia)&&ap(i3,Ib))||(ap(i2,Ib)&&ap(i3,Ia));add(ok,ok?'cBrOk':'cBrBad');pol(add,A2);pol(add,A3);}
  if(!V1)add(false,'cNeedMeter',{m:'V1'});else{const ok=ap(Math.abs(R(V1).U),Ua);add(ok,ok?'cV1pOk':'cV1pBad');pol(add,V1);}
 }
},
{
 tab:{ru:'Мощность',kz:'Қуат',en:'Power'},

 steps:{ru:['Соберите цепь: источник тока, ключ, лампа и амперметр A1 последовательно. Вольтметр V1 подключите параллельно лампе.','Установите напряжение источника 1,5 В, замкните ключ и запишите показания в строку 1.','Повторите опыт при 2,5 В и 3,5 В (строки 2 и 3). Следите за яркостью лампы.','Вычислите мощность P = U · I для каждого опыта.','Не повышайте напряжение выше 6 В — лампа перегорит.'],

 equip:{ru:['источник тока','ключ','две лампы','амперметр','вольтметр','соединительные провода'],kz:['ток көзі','кілт','екі шам','амперметр','вольтметр','жалғағыш сымдар'],en:['power supply','switch','two lamps','ammeter','voltmeter','connecting wires']},
 steps:{ru:['Соберите цепь: источник тока, ключ, амперметр A1 и две лампы Л1 и Л2, соединённые последовательно (схема 1). Вольтметр V1 подключите параллельно лампе Л2. Напряжение источника — 6 В.','Замкните ключ: обе лампы горят. Запишите показания в строку 1 и отметьте, горит ли Л2.','Нажмите на лампу Л1 и выберите «Имитировать перегорание». Что произошло с лампой Л2? Запишите показания в строку 2.','Замените лампу Л1. Пересоберите цепь: лампы соединены параллельно, амперметр A1 измеряет общий ток, V1 подключён к Л2 (схема 2). Установите напряжение 3 В и запишите показания в строку 3.','Снова сымитируйте перегорание лампы Л1 и запишите показания в строку 4.','Сравните, как ведёт себя лампа Л2 в двух случаях. Объясните, почему электроприборы в квартире соединяют параллельно.'],
  kz:['Тізбекті жинаңыз: ток көзі, кілт, A1 амперметрі және Ш1, Ш2 екі шамы тізбектей жалғанады (1-сызба). V1 вольтметрін Ш2 шамына параллель қосыңыз. Ток көзінің кернеуі — 6 В.','Кілтті тұйықтаңыз: екі шам да жанады. Көрсеткіштерді 1-жолға жазып, Ш2 жанып тұр ма, белгілеңіз.','Ш1 шамын басып, «Жанып кетуін имитациялау» батырмасын таңдаңыз. Ш2 шамына не болды? Көрсеткіштерді 2-жолға жазыңыз.','Ш1 шамын ауыстырыңыз. Тізбекті қайта жинаңыз: шамдар параллель жалғанады, A1 амперметрі жалпы токты өлшейді, V1 Ш2-ге қосылған (2-сызба). Кернеуді 3 В етіп қойып, көрсеткіштерді 3-жолға жазыңыз.','Ш1 шамының жанып кетуін қайта имитациялап, көрсеткіштерді 4-жолға жазыңыз.','Екі жағдайда Ш2 шамының қалай әрекет ететінін салыстырыңыз. Пәтердегі электр құралдары неліктен параллель жалғанатынын түсіндіріңіз.'],

 hint:{ru:'При последовательном соединении перегорание одной лампы разрывает цепь: ток прекращается, и гаснут все лампы. При параллельном соединении другая лампа продолжает гореть, потому что она подключена к источнику отдельно, а общий ток уменьшается. Поэтому электроприборы в квартире соединяют параллельно. Интересно: вольтметр, подключённый к перегоревшей лампе в последовательной цепи, показывает почти всё напряжение источника.',
  kz:'Тізбектей жалғағанда бір шамның жанып кетуі тізбекті үзеді: ток тоқтайды да, барлық шам сөнеді. Параллель жалғағанда екінші шам жана береді, себебі ол ток көзіне жеке қосылған, ал жалпы ток азаяды. Сондықтан пәтердегі электр құралдары параллель жалғанады. Қызықты дерек: тізбектей тізбекте жанып кеткен шамға қосылған вольтметр ток көзінің кернеуін түгелге жуық көрсетеді.',
  en:'In a series connection one burned-out lamp breaks the circuit: the current stops and all lamps go out. In a parallel connection the other lamp keeps shining because it is connected to the supply separately, and the total current decreases. That is why household appliances are connected in parallel. Interesting: a voltmeter connected across the burned-out lamp in a series circuit shows almost the full supply voltage.'},
 schem:()=>schemBurn(),
 check:add=>{
  const all=S.comps.filter(c=>c.type==='lamp');
  if(all.length<2){add(false,'cNeed2Lamps');return;}
  const ok2=all.filter(c=>!c.props.burned),Is=srcI();
  if(ok2.length>=2&&Is>1e-4){
   const [a,b]=ok2,Ia=Math.abs(R(a).I),Ib=Math.abs(R(b).I);
   if(ap(Ia,Ib)&&ap(Is,Ia))add(true,'cSerL');
   else if(ap(Math.abs(R(a).U),Math.abs(R(b).U))&&ap(Is,Ia+Ib))add(true,'cParL');
  }
  if(all.some(c=>c.props.burned))add(true,'cBurnInfo');
  const A1=meter('A1');
  if(!A1)add(false,'cNeedMeter',{m:'A1'});else if(Is>1e-4){const ok=ap(Math.abs(R(A1).I),Is);add(ok,ok?'cTotOk':'cTotBad');pol(add,A1);}
  const V1=meter('V1');
  if(!V1)add(false,'cNeedMeter',{m:'V1'});else{const ok=all.some(l=>across(V1,l));add(ok,ok?'cVoltOk':'cVoltBad',{m:'V1',y:'@datLamp'});pol(add,V1);}
 }

 equip:{ru:['источник тока','предохранитель 1 А','ключ','три лампы','амперметр','вольтметр','соединительные провода'],kz:['ток көзі','1 А сақтандырғыш','кілт','үш шам','амперметр','вольтметр','жалғағыш сымдар'],en:['power supply','1 A fuse','switch','three lamps','ammeter','voltmeter','connecting wires']},
 steps:{ru:['Соберите цепь: источник тока, предохранитель FU1 (1 А), ключ, амперметр A1 и лампа Л1 последовательно. Вольтметр V1 подключите параллельно лампе. Напряжение источника — 4,5 В.','Замкните ключ: лампа горит. Запишите показания в строку 1 и отметьте, цел ли предохранитель.','Соедините клеммы лампы Л1 дополнительным проводом — это короткое замыкание. Что произошло с предохранителем и лампой? Запишите показания в строку 2.','Уберите лишний провод и замените предохранитель (кнопка в его свойствах). Подключите ещё две лампы параллельно лампе Л1 и замкните ключ — это перегрузка. Запишите показания в строку 3.','Объясните, почему перегоревший предохранитель нельзя заменять проволокой («жучком»).'],
  kz:['Тізбекті жинаңыз: ток көзі, FU1 сақтандырғышы (1 А), кілт, A1 амперметрі және Ш1 шамы тізбектей жалғанады. V1 вольтметрін шамға параллель қосыңыз. Ток көзінің кернеуі — 4,5 В.','Кілтті тұйықтаңыз: шам жанады. Көрсеткіштерді 1-жолға жазып, сақтандырғыштың бүтін екенін белгілеңіз.','Ш1 шамының клеммаларын қосымша сыммен жалғаңыз — бұл қысқа тұйықталу. Сақтандырғыш пен шамға не болды? Көрсеткіштерді 2-жолға жазыңыз.','Артық сымды алып тастап, сақтандырғышты ауыстырыңыз (оның қасиеттеріндегі батырма). Ш1 шамына параллель тағы екі шам қосып, кілтті тұйықтаңыз — бұл асқын жүктеме. Көрсеткіштерді 3-жолға жазыңыз.','Жанып кеткен сақтандырғышты неліктен сыммен («жучокпен») ауыстыруға болмайтынын түсіндіріңіз.'],
  en:['Assemble the circuit: power supply, fuse FU1 (1 A), switch, ammeter A1 and lamp L1 in series. Connect voltmeter V1 in parallel with the lamp. Set the supply voltage to 4.5 V.','Close the switch: the lamp is lit. Record the readings in row 1 and note whether the fuse is intact.','Connect the terminals of lamp L1 with an extra wire — this is a short circuit. What happened to the fuse and the lamp? Record the readings in row 2.','Remove the extra wire and replace the fuse (button in its properties). Connect two more lamps in parallel with L1 and close the switch — this is an overload. Record the readings in row 3.','Explain why a blown fuse must never be replaced with a piece of wire.']},
 rowLabels:{ru:['Цепь исправна, одна лампа','Короткое замыкание: лампа замкнута проводом','Перегрузка: три лампы параллельно'],kz:['Тізбек дұрыс, бір шам','Қысқа тұйықталу: шам сыммен тұйықталған','Асқын жүктеме: үш шам параллель'],en:['Normal circuit, one lamp','Short circuit: lamp bridged by a wire','Overload: three lamps in parallel']},
 cols:[{id:'I',head:'I, @A',src:'A1'},{id:'U',head:'U, @V',src:'V1'},{id:'F',head:'@fuseQ',obs:true}],rows:3,allowOpen:true,
 hint:{ru:'При коротком замыкании сопротивление цепи становится очень малым, и ток резко возрастает. При перегрузке ток растёт, потому что подключено слишком много потребителей. В обоих случаях провода могут перегреться и вызвать пожар. Предохранитель перегорает раньше и разрывает цепь. Если заменить его проволокой, защита пропадёт.',
  kz:'Қысқа тұйықталу кезінде тізбектің кедергісі өте аз болады да, ток күрт артады. Асқын жүктеме кезінде тым көп тұтынушы қосылғандықтан ток артады. Екі жағдайда да сымдар қызып, өрт шығуы мүмкін. Сақтандырғыш одан бұрын жанып, тізбекті үзеді. Оны сыммен ауыстырса, қорғаныс жойылады.',
  en:'In a short circuit the resistance of the circuit becomes very small and the current rises sharply. In an overload the current rises because too many devices are connected. In both cases the wires can overheat and cause a fire. The fuse blows first and breaks the circuit. If it is replaced with a piece of wire, the protection is lost.'},
 schem:()=>schemSimple(true,'',true),
 check:add=>{
  const fs=S.comps.filter(c=>c.type==='fuse');if(!fs.length){add(false,'cNeedFuse');return;}
  const Is=srcI(),lamps=S.comps.filter(c=>c.type==='lamp');
  if(fs.some(c=>c.props.blown))add(true,'cFuseInfo');
  else if(Is>1e-4){const ok=fs.some(f=>ap(Math.abs(R(f).I),Is));add(ok,ok?'cFuseSer':'cFuseSerBad');}
  if(!lamps.length){add(false,'cNeedLamp');return;}
  const A1=meter('A1');
  if(!A1)add(false,'cNeedMeter',{m:'A1'});else if(Is>1e-4){const ok=ap(Math.abs(R(A1).I),Is);add(ok,ok?'cTotOk':'cTotBad');pol(add,A1);}
  const V1=meter('V1');
  if(!V1)add(false,'cNeedMeter',{m:'V1'});else{const ok=lamps.some(l=>across(V1,l));add(ok,ok?'cVoltOk':'cVoltBad',{m:'V1',y:'@datLamp'});pol(add,V1);}
 }
}];

const ap=(a,b)=>Math.abs(a-b)<=0.01*Math.max(Math.abs(a),Math.abs(b))+2e-4;
const meter=l=>S.comps.find(c=>(c.type==='ammeter'||c.type==='voltmeter')&&c.label===l);
const loads=types=>S.comps.filter(c=>types.includes(c.type)&&!(c.type==='lamp'&&c.props.burned));
const pick=ls=>ls.reduce((b,c)=>Math.abs(R(c).I)>Math.abs(R(b).I)?c:b,ls[0]);
const srcI=()=>S.comps.filter(c=>c.type==='source').reduce((s,c)=>s+Math.abs(R(c).I),0);
const across=(m,c)=>{const n=sol.nodeOf,a=[n[m.id+':0'],n[m.id+':1']].sort(),b=[n[c.id+':0'],n[c.id+':1']].sort();return a[0]===b[0]&&a[1]===b[1];};
function pol(add,m){const v=m.type==='ammeter'?R(m).I:R(m).U;if(v<-1e-4)add(false,'cPol',{m:m.label});}
function chkAmm(add,lbl,load,x){const m=meter(lbl);if(!m){add(false,'cNeedMeter',{m:lbl});return;}const ok=Math.abs(R(load).I)>1e-4&&ap(Math.abs(R(m).I),Math.abs(R(load).I));add(ok,ok?'cAmmOk':'cAmmBad',{m:lbl,x});pol(add,m);}
function chkVolt(add,lbl,load,y){const m=meter(lbl);if(!m){add(false,'cNeedMeter',{m:lbl});return;}const ok=Math.abs(R(load).U)>1e-4&&ap(Math.abs(R(m).U),Math.abs(R(load).U));add(ok,ok?'cVoltOk':'cVoltBad',{m:lbl,y});pol(add,m);}
const anyBurned=()=>S.comps.some(c=>c.type==='lamp'&&c.props.burned);
const anyFuse=()=>S.comps.some(c=>c.type==='fuse'&&c.props.blown);
function runCheck(){
 const L=LABS[S.lab],out=[],add=(ok,key,p)=>out.push({ok,key,p});
 if(!S.comps.some(c=>c.type==='source')){add(false,'cNoSource');return out;}
 add(true,'cSource');
 const hasKey=S.comps.some(c=>c.type==='switch');add(hasKey,hasKey?'cKey':'cNoKey');
 if(sol.tripped.size){add(false,'cOverload');return out;}
 if(srcI()<1e-4){if(L.allowOpen&&anyFuse())add(true,'cFuseOpen');else if(L.allowOpen&&anyBurned())add(true,'cBurnOpen');else{add(false,'cOpen');return out;}}
 else add(true,'cClosed');
 L.check(add);
 if(out.every(o=>o.ok))out.push({ok:true,key:'cAllOk',sum:true});
 return out;
}

/* ---------- journal ---------- */
const J=$('journal');
function tbl(){const L=LABS[S.lab];let r=S.tables[S.lab];if(!Array.isArray(r)||r.length!==L.rows){const old=Array.isArray(r)?r:[];r=Array.from({length:L.rows},(_,i)=>old[i]||{});S.tables[S.lab]=r;}return r;}
const cst=()=>calcSt[S.lab]||(calcSt[S.lab]={});
function tableHtml(){
 const L=LABS[S.lab],rows=tbl(),st=cst(),rl=L.rowLabels&&L.rowLabels[S.lang];
 let h=`<thead><tr><th>${rl?t('stateCol'):'№'}</th>${L.cols.map(c=>`<th${c.calc?' class="calc"':''}>${units(c.head)}${c.obs?'':`<small>${c.src?(c.src.startsWith('prop:')?'Rx':c.src):t('calcMark')}</small>`}</th>`).join('')}<th><span class="sr">${t('record')}</span></th></tr></thead><tbody>`;
 rows.forEach((r,i)=>{
  h+=`<tr>${rl?`<td class="rl">${i+1}. ${rl[i]}</td>`:`<td>${i+1}</td>`}${L.cols.map(c=>{
   const id=`cell-${S.lab}-${i}-${c.id}`,lab=`${esc(plain(c.head))} — ${t('trial')} ${i+1}`;
   if(c.text)return `<td class="txt">${r[c.id]?t('mat_'+r[c.id]):'—'}</td>`;
   if(c.obs){const v=r[c.id]||'';return `<td><select id="${id}" data-r="${i}" data-c="${c.id}" aria-label="${lab}"><option value=""${v?'':' selected'}>—</option><option value="yes"${v==='yes'?' selected':''}>${t('yes')}</option><option value="no"${v==='no'?' selected':''}>${t('no')}</option></select></td>`;}
   const s=st[i+':'+c.id];return `<td><input id="${id}" data-r="${i}" data-c="${c.id}" inputmode="decimal" autocomplete="off" value="${esc(r[c.id]||'')}" class="${s?(s.ok?'ok':'bad'):''}" aria-label="${lab}"></td>`;
  }).join('')}<td><button type="button" class="btn rec" data-rec="${i}">${t('record')}</button></td></tr>`;
 });
 return h+'</tbody>';
}
function checksHtml(){
 const list=checks[S.lab]||[];
 return list.map(o=>`<li class="${o.ok?'ok':'bad'}${o.sum?' sum':''}"><span class="mk" aria-hidden="true">${o.ok?'✓':'!'}</span><span>${t(o.key,o.p)}</span></li>`).join('');
}
function nice(v){const e=Math.pow(10,Math.floor(Math.log10(v))),f=v/e;return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*e;}
const axf=v=>String(+v.toFixed(3)).replace('.',dec());
function graphSvg(){
 const L=LABS[S.lab],g=L.graph;if(!g)return '';
 const pts=tbl().map(r=>[num(r[g.x]),num(r[g.y])]).filter(([x,y])=>isFinite(x)&&isFinite(y));
 const Wg=400,Hg=250,l=48,rr=16,tp=18,b=40,pw=Wg-l-rr,ph=Hg-tp-b;
 const xm=nice(Math.max(1,...pts.map(p=>p[0]))),ym=nice(Math.max(0.1,...pts.map(p=>p[1])));
 const X=v=>l+v/xm*pw,Y=v=>tp+ph-v/ym*ph;
 let s='';
 for(let i=0;i<=5;i++){const xv=xm*i/5,yv=ym*i/5;s+=`<line x1="${X(xv)}" y1="${tp}" x2="${X(xv)}" y2="${tp+ph}" class="g-grid"/><line x1="${l}" y1="${Y(yv)}" x2="${l+pw}" y2="${Y(yv)}" class="g-grid"/><text x="${X(xv)}" y="${tp+ph+15}" text-anchor="middle" class="g-lbl">${axf(xv)}</text><text x="${l-6}" y="${Y(yv)+4}" text-anchor="end" class="g-lbl">${axf(yv)}</text>`;}
 s+=`<line x1="${l}" y1="${tp+ph}" x2="${l+pw}" y2="${tp+ph}" class="g-axis"/><line x1="${l}" y1="${tp}" x2="${l}" y2="${tp+ph}" class="g-axis"/>`;
 s+=`<text x="${l+pw}" y="${Hg-6}" text-anchor="end" class="g-ttl">${units(g.xl)}</text><text x="${l+4}" y="${tp-5}" class="g-ttl">${units(g.yl)}</text>`;
 if(!pts.length)s+=`<text x="${l+pw/2}" y="${tp+ph/2}" text-anchor="middle" class="g-lbl">${t('graphEmpty')}</text>`;
 else{
  if(g.fit){const sxy=pts.reduce((a,p)=>a+p[0]*p[1],0),sxx=pts.reduce((a,p)=>a+p[0]*p[0],0);if(sxx>0){const k=sxy/sxx;let xe=xm;if(k*xe>ym)xe=ym/k;s+=`<line x1="${X(0)}" y1="${Y(0)}" x2="${X(xe).toFixed(1)}" y2="${Y(k*xe).toFixed(1)}" class="g-fit"/>`;}}
  else if(pts.length>1){const sp=[[0,0],...pts].sort((a,b)=>a[0]-b[0]);s+=`<polyline points="${sp.map(p=>X(p[0]).toFixed(1)+','+Y(p[1]).toFixed(1)).join(' ')}" class="g-line"/>`;}
  s+=pts.map(p=>`<circle cx="${X(p[0]).toFixed(1)}" cy="${Y(p[1]).toFixed(1)}" r="4.5" class="g-pt"/>`).join('');
 }
 return `<svg viewBox="0 0 ${Wg} ${Hg}" role="img" aria-label="${esc(g.title[S.lang])}">${s}</svg>`;
}
function renderJournal(){
 const L=LABS[S.lab],lg=S.lang,hasCalc=L.cols.some(c=>c.calc);
 J.innerHTML=`<div class="j-num">${t('labN',{n:S.lab+1})}</div><h2>${L.title[lg]}</h2>
<div class="j-body"><div class="j-col">
<section><h3>${t('goal')}</h3><p>${L.goal[lg]}</p></section>
<section><h3>${t('equip')}</h3><ul>${L.equip[lg].map(x=>`<li>${x}</li>`).join('')}</ul></section>
<section><h3>${t('scheme')}</h3><div class="schem">${L.schem()}</div></section>
<section><h3>${t('steps')}</h3><ol>${L.steps[lg].map(x=>`<li>${x}</li>`).join('')}</ol></section>
</div><div class="j-col">
<section><h3>${t('table')}</h3><div class="tbl-wrap"><table class="mt">${tableHtml()}</table></div>
<div class="actions"><button type="button" class="btn primary" id="jCheck">${t('checkCircuit')}</button>${hasCalc?`<button type="button" class="btn" id="jCalc">${t('checkCalc')}</button>`:''}<button type="button" class="btn" id="jClear">${t('clearTable')}</button></div>
<ul class="checks" id="jChecks" aria-live="polite">${checksHtml()}</ul></section>
${L.graph?`<section><h3>${L.graph.title[lg]}</h3><div class="graph" id="jGraph">${graphSvg()}</div></section>`:''}
<section><h3><label for="jConcl">${t('concl')}</label></h3><textarea id="jConcl" placeholder="${esc(t('conclPh'))}">${esc(S.concl[S.lab]||'')}</textarea>
<details><summary>${t('hint')}</summary><p>${L.hint[lg]}</p></details></section>
${L.extra?`<section class="extra"><h3>${t('extraTitle')}</h3><p>${L.extra[lg]}</p></section>`:''}
<div class="actions"><button type="button" class="btn" id="jCopy">${t('copy')}</button><span class="copy-msg" id="jCopyMsg" role="status"></span></div>
<textarea class="report-fallback" id="jReport" hidden readonly aria-label="${esc(t('copy'))}"></textarea>
</div></div>`;
}
function setChecks(list){checks[S.lab]=list;const el=$('jChecks');if(el)el.innerHTML=checksHtml();}
function record(i){
 const L=LABS[S.lab],row=tbl()[i],miss=[];
 const cds=S.comps.filter(c=>c.type==='cond'),cd=cds.find(c=>Math.abs(R(c).I)>1e-4)||cds[0];
 L.cols.forEach(c=>{
  if(!c.src)return;
  if(c.src.startsWith('prop:')){
   if(!cd){if(!miss.includes('Rx'))miss.push('Rx');return;}
   const k=c.src.slice(5);row[c.id]=k==='mat'?cd.props.mat:k==='L'?fmt(cd.props.L,2):fmt(cd.props.S,1);return;
  }
  const m=meter(c.src);if(!m){miss.push(c.src);return;}row[c.id]=fmt(m.type==='ammeter'?R(m).I:R(m).U,2);
 });
 const st=cst();Object.keys(st).forEach(k=>{if(k.split(':')[0]===String(i))delete st[k];});
 const msg=[],noCur=srcI()<1e-4||sol.tripped.size>0,expectOpen=L.allowOpen&&(anyBurned()||anyFuse());
 if(miss.length)msg.push({ok:false,key:'recMissing',p:{m:miss.join(', ')}});
 if(noCur&&!expectOpen)msg.push({ok:false,key:'recNoCurrent'});
 else if(!miss.length)msg.push({ok:true,key:'recOk',p:{n:i+1}});
 checks[S.lab]=msg;save();renderJournal();
}
function checkCalc(){
 const L=LABS[S.lab],rows=tbl(),st={};let total=0,good=0;
 rows.forEach((r,i)=>{
  const m={};let have=true;
  L.cols.filter(c=>c.src&&!c.text).forEach(c=>{m[c.id]=num(r[c.id]);if(!isFinite(m[c.id]))have=false;});
  if(!have)return;
  L.cols.filter(c=>c.calc).forEach(c=>{const exp=c.calc(m);if(!isFinite(exp))return;total++;const v=num(r[c.id]);const ok=isFinite(v)&&Math.abs(v-exp)<=Math.max(0.015*Math.abs(exp),0.011);if(ok)good++;st[i+':'+c.id]={ok};});
 });
 calcSt[S.lab]=st;
 checks[S.lab]=total?[{ok:good===total,key:good===total?'calcAll':'calcSome',p:{a:good,b:total}}]:[{ok:false,key:'calcEmpty'}];
 renderJournal();
}
function reportText(){
 const L=LABS[S.lab],rows=tbl(),rl=L.rowLabels&&L.rowLabels[S.lang];
 const lines=[`${t('brand')} — ${t('labN',{n:S.lab+1})}. ${L.title[S.lang]}`,t('author'),'',t('goal')+': '+L.goal[S.lang],'',t('table')+':',[rl?t('stateCol'):'№',...L.cols.map(c=>plain(c.head))].join('\t')];
 rows.forEach((r,i)=>lines.push([rl?`${i+1}. ${rl[i]}`:i+1,...L.cols.map(c=>c.obs?(r[c.id]?t(r[c.id]):''):c.text?(r[c.id]?t('mat_'+r[c.id]):''):(r[c.id]||''))].join('\t')));
 lines.push('',t('concl')+': '+(S.concl[S.lab]||''));
 return lines.join('\n');
}
let tblArm=0;
J.addEventListener('click',e=>{
 const rec=e.target.closest('[data-rec]');if(rec){record(+rec.dataset.rec);return;}
 const id=e.target.id;
 if(id==='jCheck')setChecks(runCheck());
 else if(id==='jCalc')checkCalc();
 else if(id==='jClear'){
  const b=e.target;
  if(!tblArm){b.textContent=t('clearSure');b.classList.add('armed');tblArm=setTimeout(()=>{tblArm=0;b.textContent=t('clearTable');b.classList.remove('armed');},3000);return;}
  clearTimeout(tblArm);tblArm=0;S.tables[S.lab]=null;calcSt[S.lab]={};checks[S.lab]=[];save();renderJournal();
 }
 else if(id==='jCopy'){
  const txt=reportText(),msg=$('jCopyMsg'),fb=$('jReport');
  const fallback=()=>{msg.textContent=t('copyFail');fb.hidden=false;fb.value=txt;fb.focus();fb.select();};
  try{navigator.clipboard.writeText(txt).then(()=>{msg.textContent=t('copied');fb.hidden=true;},fallback);}catch(_){fallback();}
 }
});
J.addEventListener('input',e=>{
 const el=e.target;
 if(el.id==='jConcl'){S.concl[S.lab]=el.value;save();return;}
 if(el.dataset&&el.dataset.c){
  tbl()[+el.dataset.r][el.dataset.c]=el.value;el.classList.remove('ok','bad');delete cst()[el.dataset.r+':'+el.dataset.c];save();
  const g=$('jGraph');if(g)g.innerHTML=graphSvg();
 }
});

 const id=e.target.id;
 if(id==='aClose')setAbout(false);
 else if(id==='aBig'){aboutEl.classList.toggle('big');e.target.textContent=t(aboutEl.classList.contains('big')?'qrSmall':'qrBig');}
 else if(id==='aCopy'){
  const msg=$('aMsg'),sel=()=>{const r=document.createRange();r.selectNodeContents($('aUrl'));const s=getSelection();s.removeAllRanges();s.addRange(r);};
  try{navigator.clipboard.writeText(LAB_URL).then(()=>{msg.textContent=t('linkCopied');},sel);}catch(_){sel();}
 }
});

/* ---------- chrome ---------- */
function renderShelf(){
 let h='';
 for(let i=0;i<SHELF.length;i+=2){
  h+='<div class="plank">'+[i,i+1].filter(k=>k<SHELF.length).map(k=>{const s=SHELF[k],c=Object.assign({id:'s'+k,rot:0,x:0,y:0},JSON.parse(JSON.stringify(s)));return `<button type="button" class="item" data-shelf="${k}" aria-label="${esc(s.name[S.lang])}"><svg viewBox="-64 -50 128 100" aria-hidden="true">${staticComp(c)}</svg><span>${s.name[S.lang]}</span></button>`;}).join('')+'</div>';
 }
 shelfEl.innerHTML=h;
}
function renderTabs(){
 $('tabs').innerHTML=LABS.map((L,i)=>`<button type="button" class="tab" role="tab" aria-selected="${i===S.lab}" data-lab="${i}">${S.lang==='en'?'Lab '+(i+1)+' · ':'№'+(i+1)+' '}${L.tab[S.lang]}</button>`).join('');
}
$('tabs').addEventListener('click',e=>{const b=e.target.closest('[data-lab]');if(!b)return;S.lab=+b.dataset.lab;renderTabs();renderJournal();save();});
document.querySelectorAll('[data-lang]').forEach(b=>b.addEventListener('click',()=>{S.lang=b.dataset.lang;renderAll();save();}));
function renderStatic(){
 document.documentElement.lang={kz:'kk',ru:'ru',en:'en'}[S.lang];
 document.querySelectorAll('[data-t]').forEach(el=>{el.textContent=t(el.dataset.t);});
 document.querySelectorAll('[data-lang]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.lang===S.lang)));
 svg.setAttribute('aria-label',t('benchLabel'));$('benchBox').setAttribute('aria-label',t('benchLabel'));$('schem').setAttribute('aria-label',t('schemLabel'));
 $('emblem').alt=t('emblemAlt');$('example').textContent=t('example');$('bFlow').setAttribute('aria-pressed',String(S.flow));propsKey='';
}
function renderAll(){renderStatic();renderShelf();renderTabs();render();renderJournal();renderAbout();}

if(!load())example();
renderAll();
if(location.hash==='#about')setAbout(true);
window.__lab={S,solve:()=>{sol=solve();return sol;},runCheck,render,place:(i,x,y)=>place(SHELF[i],x,y),addWire:(a,b)=>{addWire(a,b);render();},route};
})();
